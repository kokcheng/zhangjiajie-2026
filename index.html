<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Zhangjiajie / Fenghuang Avatar Tour – 3–11 Nov 2026</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
:root{--bg:#f4f6f5;--card:#fff;--ink:#1d2b26;--mute:#5d6e68;--accent:#0f766e;--line:#dfe6e3}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink);-webkit-text-size-adjust:100%}
header{background:linear-gradient(135deg,#0f766e,#134e4a);color:#fff;padding:14px 16px calc(10px)}
header h1{margin:0;font-size:1.15rem}
header p{margin:2px 0 0;font-size:.85rem;opacity:.9}
nav.tabs{display:flex;position:sticky;top:0;z-index:1000;background:#fff;border-bottom:1px solid var(--line)}
nav.tabs button{flex:1;padding:12px 4px;border:0;background:none;font:inherit;font-weight:600;color:var(--mute);border-bottom:3px solid transparent;cursor:pointer}
nav.tabs button.on{color:var(--accent);border-color:var(--accent)}
.layout{display:block}
section.pane{display:none;padding:12px}
section.pane.on{display:block}
#pane-map{padding:0}
#map{height:calc(100vh - 140px);min-height:360px;width:100%}
.chips{display:flex;gap:6px;overflow-x:auto;padding:8px 12px;background:#fff;border-bottom:1px solid var(--line);scrollbar-width:none}
.chips button{flex:none;border:1px solid var(--line);background:#fff;border-radius:999px;padding:5px 12px;font:inherit;font-size:.85rem;cursor:pointer}
.chips button.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:12px}
.card h2{margin:0 0 2px;font-size:1.02rem}
.date{color:var(--accent);font-weight:700;font-size:.8rem;text-transform:uppercase;letter-spacing:.04em}
.meals{font-size:.82rem;color:var(--mute);margin:4px 0 8px}
.stay{font-size:.85rem;background:#ecf7f5;border-radius:8px;padding:6px 10px;margin-top:8px}
.stops{padding-left:0;list-style:none;margin:8px 0}
.stops li{margin:3px 0;font-size:.9rem}
.stops a{color:var(--accent);cursor:pointer;text-decoration:underline dotted}
.note{font-size:.8rem;color:var(--mute);border-left:3px solid #e2b93b;padding-left:8px;margin-top:8px}
.btn{display:inline-block;margin-top:8px;padding:6px 12px;border-radius:8px;background:var(--accent);color:#fff;text-decoration:none;font-size:.85rem;border:0;cursor:pointer;font-family:inherit}
.btn.alt{background:#fff;color:var(--accent);border:1px solid var(--accent);margin-left:6px}
.hotel h2{font-size:1rem}
.hotel .nights{font-size:.85rem;color:var(--mute)}
table{width:100%;border-collapse:collapse;font-size:.88rem}
td,th{padding:6px 4px;text-align:left;border-bottom:1px solid var(--line);vertical-align:top}
footer{padding:14px;font-size:.78rem;color:var(--mute);text-align:center}
.pin{display:flex;align-items:center;justify-content:center;width:26px;height:26px;border-radius:50%;color:#fff;font-weight:700;font-size:12px;border:2px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.4)}
.pin.hotel{border-radius:6px;font-size:14px}
@media(min-width:900px){
  nav.tabs{display:none}
  .layout{display:grid;grid-template-columns:minmax(380px,45%) 1fr;height:calc(100vh - 66px)}
  section.pane{display:block!important;overflow:auto}
  #pane-map{grid-column:2;display:flex!important;flex-direction:column;overflow:hidden}
  .left{overflow:auto;grid-column:1}
  #map{height:auto;flex:1;min-height:0}
}
.left{display:contents}
@media(min-width:900px){.left{display:block;overflow:auto;padding:12px}.left section.pane{padding:0}}
</style>
</head>
<body>
<header>
  <h1>9D7N Zhangjiajie / Fenghuang Avatar Tour</h1>
  <p>Chan Brothers · Tour CN8ZZ1 · Tue 3 Nov – Wed 11 Nov 2026</p>
</header>
<nav class="tabs" id="tabs">
  <button data-p="itin" class="on">Itinerary</button>
  <button data-p="map">Map</button>
  <button data-p="hotels">Hotels</button>
</nav>
<div class="layout">
  <div class="left">
    <section class="pane on" id="pane-itin"></section>
    <section class="pane" id="pane-hotels"></section>
  </div>
  <section class="pane" id="pane-map">
    <div class="chips" id="chips"></div>
    <div id="map"></div>
  </section>
</div>
<footer>Map pins are approximate. Itinerary and hotels are subject to change – re-confirm with Chan Brothers.</footer>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const COLORS=["#0f766e","#c2410c","#7c3aed","#2563eb","#be123c","#4d7c0f","#b45309","#0e7490"];

const HOTELS={
  wgp:{name:"Wyndham Grand Plaza Royale Furongguo",city:"Changsha",addr:"106 Furong Middle Rd, Changsha, Hunan, China",tel:"+86-731-88688888",room:"1 TWN",ll:[28.1950,112.9990]},
  crown:{name:"Crown International Hotel",city:"Xiangxi / Fenghuang",addr:"Fenghuang, Xiangxi, Hunan (address not on voucher)",tel:"+86-743-8529999",ll:[27.9440,109.6050]},
  hj:{name:"Howard Johnson Neodalle Resort",city:"Zhangjiajie (Wulingyuan)",addr:"No. 168 Gaoyun Road, Wulingyuan District, Zhangjiajie, Hunan 427000, China",tel:"+86-744-5999999",ll:[29.3380,110.5440]},
  wc:{name:"Wyndham Changsha",city:"Changsha",addr:"No.48 Xiangfu Middle Road, Yuhua District, Changsha, Hunan",tel:"+86-731-85855888",ll:[28.1530,113.0050]}
};
HOTELS.wgp.nights="3 Nov – 4 Nov (1 night)";
HOTELS.crown.nights="4 Nov – 5 Nov (1 night)";
HOTELS.hj.nights="5 Nov – 9 Nov (4 nights)";
HOTELS.wc.nights="9 Nov – 10 Nov (1 night)";

const DAYS=[
 {d:"Tue 3 Nov",t:"Singapore → Changsha",meals:"Meals: on board / own arrangement",stay:"wgp",
  desc:"Report at Changi Airport T1 Scoot counter Row 5 at 15:10 (check-in closes 60 min before departure). Fly TR124 18:10 → 23:05, then transfer to hotel.",
  note:"If a nationwide conference is on, accommodation moves to a similar hotel in Changde.",
  stops:[["Changi Airport T1 (SIN)",[1.3644,103.9915],"TR124 dep 18:10"],["Changsha Huanghua Airport (CSX)",[28.1892,113.2196],"Arrive 23:05"],["hotel:wgp"]]},
 {d:"Wed 4 Nov",t:"Changsha → Fenghuang",meals:"Breakfast · Lunch · Dinner (Miao flavour)",stay:"crown",
  desc:"Ride the Fenghuang Maglev Sightseeing Express (4 stations, ~25 min, no assigned seats). Visit the Fenghuang Eye observation deck, East Gate City Tower, Rainbow Bridge & Fengyu Tower; eco-car tour of the old town. Evening: Xiangjian Tuojiang River Art Night Cruise (Cui Cui show, 3D light show, stilted houses).",
  stops:[["hotel:wgp"],["Fenghuang Maglev & Eye Observation Deck",[27.9540,109.5930],"Maglev + overlook"],["Fenghuang Ancient City",[27.9500,109.5980],"East Gate Tower, Rainbow Bridge, eco-car"],["Tuojiang River Night Cruise",[27.9490,109.5995],"Evening art cruise"],["hotel:crown"]]},
 {d:"Thu 5 Nov",t:"Fenghuang → Zhangjiajie",meals:"Breakfast · Lunch (Tujia flavour at Miao village) · Dinner",stay:"hj",
  desc:"Visit Morong Miao Village, then Furong Town (Wang Village) – the “thousand-year town hanging on a waterfall”. Coach on to Zhangjiajie and check in.",
  note:"Itinerary PDF lists Sunshine Hotel for this night; the hotel list confirms Howard Johnson Neodalle Resort (shown here).",
  stops:[["hotel:crown"],["Morong Miao Village",[28.3000,109.5200],"Miao culture"],["Furong Town (Wang Village)",[28.9285,109.9058],"Waterfall town"],["hotel:hj"]]},
 {d:"Fri 6 Nov",t:"Tianmen Mountain",meals:"Breakfast · Lunch (wild mushroom soup) · Dinner (Korean BBQ**)",stay:"hj",
  desc:"One-way cable car up Tianmen Mountain National Forest Park, escalators and express cable car between spots, Tianmen Cave (highest natural arch), and the 109.9 m Seventy-Two Scenic Towers.",
  note:"Winter visiting methods and attractions may change with scenic-area notices.",
  stops:[["hotel:hj"],["Tianmen Mountain",[29.0540,110.4830],"Cable car, escalators"],["Tianmen Cave",[29.0510,110.4780],"Highest natural arch"],["Seventy-Two Scenic Towers",[29.0560,110.4850],"109.9 m"],["hotel:hj"]]},
 {d:"Sat 7 Nov",t:"Forest Park · Yuanjiajie · Tianzi Mountain",meals:"Breakfast · Lunch · Dinner (Suoxi Shanzhai)",stay:"hj",
  desc:"Zhangjiajie Forest Park with the Bailong Elevator (VIP + Express Entry). Yuanjiajie: First Bridge Under Heaven, Back Garden. Tianzi Mountain, West Sea and Helong Park, then Tianzi cable car down and the VIP bus to the cableway car park.",
  note:"Eco-vehicles may be suspended on icy roads in winter; some sights may be skipped.",
  stops:[["hotel:hj"],["Bailong Elevator",[29.3430,110.4380],"VIP + Express Entry"],["Yuanjiajie (First Bridge)",[29.3300,110.4350],"Back Garden"],["Tianzi Mountain",[29.3800,110.4770],"King of peaks"],["Helong Park",[29.3880,110.4390],"Tianzi cable car down"],["hotel:hj"]]},
 {d:"Sun 8 Nov",t:"Golden Whip Stream · Grand Canyon",meals:"Breakfast · Lunch (wood-fire Sanxia wok) · Dinner",stay:"hj",
  desc:"Walk the Golden Whip Stream, ride the Ten-Mile Gallery mini train (return included), then the Grand Canyon scenic area and the Yuntiandu Glass Bridge.",
  note:"If the Grand Canyon is closed it is replaced by Huangshizhai (cable car up & down).",
  stops:[["hotel:hj"],["Golden Whip Stream",[29.3290,110.4370],"Stream walk"],["Ten-Mile Gallery",[29.3540,110.4510],"Mini train"],["Zhangjiajie Grand Canyon",[29.2450,110.4800],"Glass bridge"],["hotel:hj"]]},
 {d:"Mon 9 Nov",t:"Zhangjiajie → Changsha",meals:"Breakfast · Lunch · Dinner (hotel seafood buffet)",stay:"wc",
  desc:"Hunan Provincial Museum (closed Mondays – replaced by Jiankudumu Museum if closed or reservation fails), Du Fu Pavilion with views of Orange Isle, free time at Huangxing Road Pedestrian Street. Dinner: seafood buffet at Wyndham Grand Plaza Royale Furongguo.",
  note:"Today is a Monday, so the museum substitute is likely. Hotel list shows Wyndham Changsha (Xiangfu Middle Rd) tonight.",
  stops:[["hotel:hj"],["Hunan Provincial Museum",[28.2137,112.9885],"Or Jiankudumu Museum"],["Du Fu Pavilion",[28.1880,112.9720],"Orange Isle view"],["Huangxing Road Pedestrian Street",[28.1960,112.9770],"Free time"],["hotel:wgp","Seafood buffet dinner"],["hotel:wc"]]},
 {d:"Tue 10 Nov",t:"Changsha → Singapore",meals:"Breakfast",stay:null,
  desc:"Free time at leisure after breakfast, then to the airport. Fly TR125 on 11 Nov 00:05 → 04:40 (Singapore).",
  stops:[["hotel:wc"],["Changsha Huanghua Airport (CSX)",[28.1892,113.2196],"TR125 dep 00:05 (11 Nov)"],["Changi Airport (SIN)",[1.3644,103.9915],"Arrive 04:40"]]}
];

const EXTRA={
 add:["Furong Town (cruise + eco-car)","Phoenix Ancient City eco-car","Korean BBQ"],
 opt:["Tianmen Fox Show (or Charming Xiangxi Show) + 1 hr massage – RMB500 adult / RMB250 child","Baofeng Lake (cruise + eco-car) + Orange Isle (battery car) – RMB450 adult / RMB225 child"]
};

const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const gmaps=ll=>`https://www.google.com/maps/search/?api=1&query=${ll[0]},${ll[1]}`;
function resolve(s){
  if(s[0].startsWith("hotel:")){const h=HOTELS[s[0].slice(6)];return{name:h.name,ll:h.ll,note:s[1]||"Hotel",hotel:true}}
  return{name:s[0],ll:s[1],note:s[2]||""};
}

// Itinerary pane
const itin=document.getElementById("pane-itin");
itin.innerHTML=DAYS.map((D,i)=>{
  const stops=D.stops.map((s,j)=>{const r=resolve(s);
    return `<li>${r.hotel?"🏨":"📍"} <a data-day="${i}" data-stop="${j}">${esc(r.name)}</a>${r.note?` <small style="color:var(--mute)">– ${esc(r.note)}</small>`:""}</li>`}).join("");
  const h=D.stay?HOTELS[D.stay]:null;
  return `<article class="card" id="day${i}">
   <div class="date">Day ${i+1} · ${D.d}</div>
   <h2>${esc(D.t)}</h2>
   <div class="meals">${esc(D.meals)}</div>
   <p style="margin:0">${esc(D.desc)}</p>
   <ul class="stops">${stops}</ul>
   ${D.note?`<div class="note">${esc(D.note)}</div>`:""}
   ${h?`<div class="stay">🛏 Stay: <b>${esc(h.name)}</b> · <a href="tel:${h.tel.replace(/[^+\d]/g,"")}">${h.tel}</a></div>`:""}
   <button class="btn" data-showmap="${i}">View day on map</button>
  </article>`}).join("")+
  `<article class="card"><h2>Additional tours (compulsory, pay in China)</h2>
   <p class="meals">RMB500 / adult, RMB250 / child (below 1.1 m), infant under 2 FOC</p>
   <ul>${EXTRA.add.map(x=>`<li>${x}</li>`).join("")}</ul>
   <h2 style="margin-top:10px">Optional tours</h2><ul>${EXTRA.opt.map(x=>`<li>${x}</li>`).join("")}</ul></article>`;

// Hotels pane
document.getElementById("pane-hotels").innerHTML=
 `<article class="card"><h2>Flights</h2><table>
   <tr><td><b>TR124</b></td><td>Singapore → Changsha<br>Tue 3 Nov · 18:10 → 23:05</td></tr>
   <tr><td><b>TR125</b></td><td>Changsha → Singapore<br>Wed 11 Nov · 00:05 → 04:40</td></tr></table>
   <p class="meals">Report 15:10, 3 Nov at Changi T1 Scoot counter, Row 5.</p></article>`+
 ["wgp","crown","hj","wc"].map(k=>{const h=HOTELS[k];return `<article class="card hotel">
   <h2>🏨 ${esc(h.name)}</h2>
   <div class="nights">${esc(h.nights)} · ${esc(h.city)}${h.room?" · "+h.room:""}</div>
   <p style="margin:6px 0 0">${esc(h.addr)}</p>
   <a class="btn" href="tel:${h.tel.replace(/[^+\d]/g,"")}">Call ${h.tel}</a>
   <a class="btn alt" target="_blank" rel="noopener" href="${gmaps(h.ll)}">Open in Maps</a>
  </article>`}).join("");

// Map
const map=L.map("map",{scrollWheelZoom:true}).setView([28.5,110.5],6);
L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",{maxZoom:18,attribution:"&copy; OpenStreetMap contributors"}).addTo(map);
let layer=L.layerGroup().addTo(map);
const markers={};
function draw(sel){ // sel = day index or "all"
  layer.clearLayers();Object.keys(markers).forEach(k=>delete markers[k]);
  const pts=[];
  const days=sel==="all"?DAYS.map((_,i)=>i):[sel];
  if(sel==="all"){
    const path=DAYS.flatMap(D=>D.stops.map(resolve)).map(r=>r.ll).filter(ll=>ll[0]>20);
    L.polyline(path,{color:"#64748b",weight:2,dashArray:"4 6",opacity:.7}).addTo(layer);
    Object.values(HOTELS).forEach(h=>{
      L.marker(h.ll,{icon:L.divIcon({className:"",html:`<div class="pin hotel" style="background:#334155">🏨</div>`,iconSize:[26,26],iconAnchor:[13,13]})})
       .bindPopup(`<b>${esc(h.name)}</b><br>${esc(h.nights)}<br><a href="${gmaps(h.ll)}" target="_blank" rel="noopener">Open in Maps</a>`).addTo(layer);
      pts.push(h.ll);
    });
    DAYS.forEach((D,i)=>D.stops.map(resolve).filter(r=>!r.hotel&&r.ll[0]>20).forEach(r=>{
      L.marker(r.ll,{icon:L.divIcon({className:"",html:`<div class="pin" style="background:${COLORS[i]}">${i+1}</div>`,iconSize:[26,26],iconAnchor:[13,13]})})
       .bindPopup(`<b>Day ${i+1}: ${esc(r.name)}</b><br>${esc(r.note)}<br><a href="${gmaps(r.ll)}" target="_blank" rel="noopener">Open in Maps</a>`).addTo(layer);
      pts.push(r.ll);
    }));
  } else {
    const i=sel,D=DAYS[i],rs=D.stops.map(resolve);
    L.polyline(rs.map(r=>r.ll),{color:COLORS[i],weight:3,opacity:.8}).addTo(layer);
    rs.forEach((r,j)=>{
      const m=L.marker(r.ll,{icon:L.divIcon({className:"",html:`<div class="pin ${r.hotel?"hotel":""}" style="background:${COLORS[i]}">${j+1}</div>`,iconSize:[26,26],iconAnchor:[13,13]})})
       .bindPopup(`<b>${esc(r.name)}</b><br>${esc(r.note)}<br><a href="${gmaps(r.ll)}" target="_blank" rel="noopener">Open in Maps</a>`).addTo(layer);
      markers[j]=m;pts.push(r.ll);
    });
  }
  map.fitBounds(L.latLngBounds(pts).pad(.15),{maxZoom:13});
}
const chips=document.getElementById("chips");
chips.innerHTML=`<button data-s="all" class="on">All</button>`+DAYS.map((D,i)=>`<button data-s="${i}">Day ${i+1}</button>`).join("");
function select(s){
  chips.querySelectorAll("button").forEach(b=>b.classList.toggle("on",b.dataset.s==String(s)));
  draw(s==="all"?"all":+s);
}
chips.addEventListener("click",e=>{const b=e.target.closest("button");if(b)select(b.dataset.s)});

// Tabs
function showPane(p){
  document.querySelectorAll("#tabs button").forEach(b=>b.classList.toggle("on",b.dataset.p===p));
  document.querySelectorAll("section.pane").forEach(s=>s.classList.toggle("on",s.id==="pane-"+p));
  if(p==="map")setTimeout(()=>map.invalidateSize(),50);
  window.scrollTo(0,0);
}
document.getElementById("tabs").addEventListener("click",e=>{const b=e.target.closest("button");if(b)showPane(b.dataset.p)});
itin.addEventListener("click",e=>{
  const v=e.target.closest("[data-showmap]"),a=e.target.closest("a[data-day]");
  if(v){select(v.dataset.showmap);showPane("map");}
  if(a){const d=+a.dataset.day,j=+a.dataset.stop;select(d);showPane("map");
    setTimeout(()=>{map.invalidateSize();const m=markers[j];if(m){map.setView(m.getLatLng(),12);m.openPopup()}},100);}
});
select("all");
window.addEventListener("resize",()=>map.invalidateSize());
</script>
</body>
</html>
